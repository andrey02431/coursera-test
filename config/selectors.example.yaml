# CSS/role selectors used to find things in Blackboard's UI.
#
# As of the API-based rewrite, course discovery, content-tree discovery,
# announcements, and grades all call Blackboard's real internal JSON API
# directly (see docs/blackboard-api-recon-map.md) instead of scraping
# rendered HTML - most of the selectors that used to live in this file are
# now dead and marked DEPRECATED below, kept only as a historical record.
# What's left and still live: the file-download mechanism on a content
# item's detail page (no API equivalent found yet), the discussions
# topic-page fallback body scrape (post content isn't confirmed to be
# available via API yet), login detection, and the page URL templates
# `discover-api` uses for diagnostic captures.
#
# Copy this file to selectors.yaml before editing (selectors.yaml is
# gitignored so your local tweaks don't need to be committed, though there's
# no harm in them - nothing secret lives here).

# --- Content item detail page: file download - LIVE ---
# No API endpoint found yet for an item's actual attached file (see
# "known unknowns" in docs/blackboard-api-recon-map.md). A leaf content
# item's own Ultra detail page embeds the real file URL in a hidden,
# non-clickable <a data-ally-file-preview-url="https://.../bbcswebdav/...">,
# fetched directly rather than clicking anything. The real filename comes
# from a sibling element's aria-label ("Preview File <filename>").
content_detail_file_link: "a[data-ally-file-preview-url]"
content_detail_file_url_attr: "data-ally-file-preview-url"
content_detail_file_label: "[aria-label^='Preview File ']"
# Fallback when an item has no file attachment at all (a page, a discussion
# link, etc.) - save whatever the detail page's main content region
# contains as an HTML page instead. Also used as discussions.py's
# discussion_thread_body fallback below.
content_detail_body: "main"

# --- Discussions: post content fallback - LIVE, body not yet API-confirmed ---
# Topic discovery itself is API-based (content.py's contents-tree walker,
# rooted at the virtual parent id "INTERACTIVE"). Each topic links to a
# real discussionboards/{conferenceId}/forums/{forumId} API endpoint (seen
# as a contentDetailUrl field), but its response body hasn't been
# inspected yet, so actual post text still comes from visiting the topic's
# page and falling back to content_detail_body above. If `sync` saves
# near-empty discussion HTML despite a topic clearly having posts, that
# endpoint is the thing to try next rather than tuning this selector.
discussion_thread_body: "main"

# --- Login detection - LIVE ---
# If, after navigating to a Blackboard URL, the resulting page URL contains
# any of these substrings, we're looking at a login/SSO page rather than
# Blackboard content - i.e. the saved session has expired. A real but
# still-valid SSO session can also bounce through one of these markers
# *silently* (e.g. via login.microsoftonline.com) and back - see
# blackboard_sync/browser.py's check_session() for how that's handled.
login_url_markers:
  - "login"
  - "idp"
  - "sso"
  - "authn"
  - "signin"
  - "microsoftonline.com"

# --- Page URL templates for `discover-api` diagnostic captures - LIVE ---
# Not used by the scraper itself anymore (which calls the JSON API
# directly), but discover-api still renders these pages to observe what
# API calls Blackboard's own frontend makes while loading them - that's
# how every endpoint in docs/blackboard-api-recon-map.md was found.
content_outline_url_template: "/ultra/courses/{course_id}/outline"
announcements_url_template: "/ultra/courses/{course_id}/announcements"
grades_url_template: "/ultra/courses/{course_id}/grades"
discussions_url_template: "/ultra/courses/{course_id}/engagement"

# ============================================================
# DEPRECATED below - nothing reads these anymore. Kept as a historical
# record of what the old DOM-scraping approach needed; see
# docs/blackboard-api-notes.md for the full story of why each one existed.
# ============================================================

# Course list (replaced by the real memberships API in courses.py).
course_list_url_path: "/ultra/course"
course_tile: "a.course-title"
course_id_attr: "id"
course_id_regex: "^course-link-(.+)$"
course_name: "h4.js-course-title-element, .js-course-title-element"

# Content outline tree (replaced by the contents/{id}/children API in content.py).
content_item: "div.content-list-item[data-content-id]"
content_item_id_attr: "data-content-id"
content_item_link: "a[href]"
content_folder_toggle: "button[aria-expanded='false']"

# Original/Classic course view - was always a placeholder, never implemented
# by any code; Classic courses are skipped by `sync` entirely (see
# courses.py's is_ultra flag).
original_content_frame: "iframe#contentFrame"
original_content_row: "li.liItem, li.clearfix"
original_content_link: "a.item"

# Announcements list (replaced by the real announcements API).
announcement_item: "tr.announcement-item-row"
announcement_title: "a.list-item-title"
announcement_body: "p.list-item-body"
announcement_date: "span.list-item-date-sent"

# Grades table (replaced by the real gradebook/grades API).
grade_row: "tr[data-grade-id]"
grade_name: "td[aria-describedby='course-student-grades-header-itemName']"
grade_due: "td[aria-describedby='course-student-grades-header-dueDate']"
grade_status: "td[aria-describedby='course-student-grades-header-status']"
grade_score: "td[aria-describedby='course-student-grades-header-grade']"
grade_results: "td[aria-describedby='course-student-grades-header-results']"

# Discussion topic discovery (replaced by content.py's tree walker rooted
# at "INTERACTIVE" - see discussions.py). Never actually used even before
# this: discussions.py always fell back to content_item/_id_attr/_link
# above.
discussion_item: ""
discussion_item_id_attr: ""
discussion_item_link: ""
